<script>

        a.setAttribute("href", "#" + guide.id + "/" + href.slice(1));
      } else if (/^https?:/.test(href) && a.host !== location.host) {
        a.target = "_blank"; a.rel = "noopener";
      }
    });

    // wide tables scroll sideways on phones
    body.querySelectorAll("table").forEach(function (t) {
      var w = document.createElement("div"); w.className = "icx-table-wrap";
      t.parentNode.insertBefore(w, t); w.appendChild(t);
    });

    buildToc();
    buildPager(guide);
    addPdfButton(guide);
    markCurrentDownload();
    var h1 = body.querySelector("h1");
    if (h1 && !root.dataset.keepTitle) document.title = h1.textContent + " — " + (root.dataset.siteTitle || document.title.split(" — ").pop());
  }

  function buildToc() {
    var levels = C.tocLevels, top = Math.min.apply(null, levels);
    var heads = Array.prototype.filter.call(body.querySelectorAll("h1,h2,h3,h4,h5,h6"), function (h) {
      return levels.indexOf(+h.tagName[1]) > -1;
    });
    var html = "<ul>", openSub = false;
    heads.forEach(function (h) {
      var lvl = +h.tagName[1];
      var item = '<li class="lvl-' + lvl + '"><a href="#' + esc(current.id + "/" + h.id) + '" data-target="' + esc(h.id) + '">' + esc(h.textContent) + "</a>";
      if (lvl === top) {
        if (openSub) { html += "</ul></li>"; openSub = false; } else if (html !== "<ul>") html += "</li>";
        html += item;
      } else {
        if (!openSub) { html += "<ul>"; openSub = true; }
        html += item + "</li>";
      }
    });
    html += openSub ? "</ul></li></ul>" : (heads.length ? "</li></ul>" : "</ul>");
    toc.innerHTML = heads.length ? html : '<p class="icx-status" style="padding:0">No sections</p>';

    // highlight the section currently on screen
    tocHeads = heads;
    tocLinks = {};
    toc.querySelectorAll("a").forEach(function (a) { tocLinks[a.dataset.target] = a; });
    updateActive();
  }

  var tocHeads = [], tocLinks = {}, pinnedId = null, ticking = false;
  function setActive(id) {
    var link = tocLinks[id];
    if (!link || link.classList.contains("is-active")) return;
    toc.querySelectorAll("a.is-active").forEach(function (a) { a.classList.remove("is-active"); });
    link.classList.add("is-active");
    var sb = root.querySelector(".icx-sidebar");
    if (sb.scrollHeight > sb.clientHeight) {
      var lt = link.offsetTop, st = sb.scrollTop;
      if (lt < st + 60 || lt > st + sb.clientHeight - 60) sb.scrollTop = lt - sb.clientHeight / 3;
    }
  }
  function updateActive() {
    if (!tocHeads.length) return;
    if (pinnedId) { setActive(pinnedId); return; }
    var line = topPx + 40, active = tocHeads[0];
    var atBottom = window.innerHeight + window.pageYOffset >= document.documentElement.scrollHeight - 4;
    for (var i = 0; i < tocHeads.length; i++) {
      var top = tocHeads[i].getBoundingClientRect().top;
      if (top <= line || (atBottom && top < window.innerHeight)) active = tocHeads[i];
    }
    setActive(active.id);
  }
  window.addEventListener("scroll", function () {
    if (ticking) return; ticking = true;
    requestAnimationFrame(function () { ticking = false; updateActive(); });
  }, { passive: true });
  // a click on a contents link highlights that entry, even if the page can't scroll it to the top
  ["wheel", "touchstart", "keydown"].forEach(function (ev) {
    window.addEventListener(ev, function () { pinnedId = null; }, { passive: true });
  });

  function buildPager(guide) {
    var i = guides.indexOf(guide), prev = guides[i - 1], next = guides[i + 1];
    if (!prev && !next) return;
    var div = document.createElement("nav"); div.className = "icx-pager";
    div.innerHTML =
      (prev ? '<a class="prev" href="#' + esc(prev.id) + '"><small>Previous</small>‹ ' + esc(prev.title) + "</a>" : "") +
      (next ? '<a class="next" href="#' + esc(next.id) + '"><small>Next</small>' + esc(next.title) + " ›</a>" : "");
    body.appendChild(div);
  }

  function scrollToSection(id, smooth) {
    var el = id && document.getElementById(id);
    pinnedId = el && tocLinks[id] ? id : null;
    if (el && body.contains(el)) el.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "start" });
    else if (!id) {
      var y = root.getBoundingClientRect().top + window.pageYOffset - topPx - 24;
      if (window.pageYOffset > y) window.scrollTo({ top: y, behavior: smooth ? "smooth" : "auto" });
    }
  }

  // ---- routing (#guide-id/section-id) ----
  function route(smooth) {
    var h = parseHash();
    var guide = guides.filter(function (g) { return g.id === h.guide; })[0] || guides[0];
    if (!guide) return;
    root.classList.remove("toc-open"); toggle.setAttribute("aria-expanded", "false");
    if (current === guide) { scrollToSection(h.section, smooth); return; }
    current = guide; select.value = guide.id;
    body.innerHTML = '<p class="icx-status">Loading ' + esc(guide.title) + "…</p>";
    fetchText(guide.file).then(function (md) {
      if (current !== guide) return;
      render(guide, md);
      scrollToSection(h.section, false);
    }).catch(function (e) {
      body.innerHTML = '<p class="icx-status">Sorry — this guide could not be loaded (' + esc(e.message) + ").</p>";
    });
  }

  toggle.addEventListener("click", function () {
    var open = root.classList.toggle("toc-open");
    toggle.setAttribute("aria-expanded", open ? "true" : "false");
  });
  window.addEventListener("hashchange", function () { route(true); });

  // ---- start ----
  fixStickyParents();
  Promise.all([
    window.marked ? 0 : loadScript("https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"),
    window.DOMPurify ? 0 : loadScript("https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js")
  ]).then(function () {
    marked.setOptions({ gfm: true });
    return fetchText(C.manifest);
  }).then(function (txt) {
    var data = JSON.parse(txt);
    guides = data.guides || data;
    buildSelect();
    buildDownloads();
    route(false);
  }).catch(function (e) {
    body.innerHTML = '<p class="icx-status">Sorry — the user guides could not be loaded (' + esc(e.message) + ").</p>";
  });
})();
</script>
